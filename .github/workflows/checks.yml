name: Commit Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phantom-lock-commit-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Android source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ONEUI_GH_USERNAME: ${{ secrets.ONEUI_GH_USERNAME }}
      ONEUI_GH_TOKEN: ${{ secrets.ONEUI_GH_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Compile both Android distribution variants
        run: |
          gradle --no-daemon --stacktrace \
            :app:compileSideloadDebugKotlin \
            :app:compilePlayDebugKotlin

      - name: Run Android unit tests
        run: |
          gradle --no-daemon --stacktrace \
            :app:testSideloadDebugUnitTest \
            :app:testPlayDebugUnitTest

      - name: Run Android lint checks
        run: |
          gradle --no-daemon --stacktrace \
            :app:lintSideloadDebug \
            :app:lintPlayDebug
