name: Phantom Lock Android Release

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Confirm building and publishing the next Phantom Lock release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: phantom-lock-release-apk
  cancel-in-progress: false

jobs:
  release:
    if: inputs.build_apk == true
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phantom Lock
        uses: actions/checkout@v4

      - name: Calculate next Phantom Lock release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName,isDraft,isPrerelease > releases.json
          python3 - <<'PY'
          import json
          import re
          import os
          from pathlib import Path

          releases = json.loads(Path("releases.json").read_text())
          versions = []
          for release in releases:
              if release.get("isDraft") or release.get("isPrerelease"):
                  continue
              match = re.fullmatch(r"([0-9]+)[.]([0-9]+)[.]([0-9]+)", release.get("tagName", "").removeprefix("v"))
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if not versions:
              next_version = (1, 0, 0)
          else:
              major, minor, patch = max(versions)
              if patch < 9:
                  patch += 1
              else:
                  patch = 0
                  if minor < 9:
                      minor += 1
                  else:
                      minor = 0
                      major += 1
              next_version = (major, minor, patch)

          version = ".".join(map(str, next_version))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("app_version=" + version + chr(10))
          print(f"Next Phantom Lock release version: {version}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Set Phantom Lock Android version
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("app/build.gradle.kts")
          source = path.read_text()
          version = os.environ["APP_VERSION"]
          version_code = os.environ["APP_VERSION_CODE"]
          updated = []
          code_count = 0
          name_count = 0
          for line in source.splitlines():
              stripped = line.strip()
              if stripped.startswith("versionCode = "):
                  updated.append("        versionCode = " + version_code)
                  code_count += 1
              elif stripped.startswith("versionName = "):
                  updated.append("        versionName = " + chr(34) + version + chr(34))
                  name_count += 1
              else:
                  updated.append(line)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Phantom Lock versionCode and versionName.")
          path.write_text(chr(10).join(updated) + chr(10))
          print("Configured Phantom Lock " + version + " (versionCode " + version_code + ")")
          PY

      - name: Prepare permanent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PHANTOM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHANTOM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Create both PHANTOM_KEYSTORE_BASE64 and PHANTOM_KEYSTORE_PASSWORD repository Actions secrets before building a release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/phantom-lock-release.keystore
          test -s app/phantom-lock-release.keystore
          keytool -list -keystore app/phantom-lock-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias phantomlock >/dev/null
          cat >> gradle.properties <<EOF
          PHANTOM_KEYSTORE_FILE=phantom-lock-release.keystore
          PHANTOM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          PHANTOM_KEY_ALIAS=phantomlock
          PHANTOM_KEY_PASSWORD=$KEYSTORE_PASSWORD
          EOF

      - name: Build signed Phantom Lock APK
        run: gradle --no-daemon --stacktrace :app:assembleSideloadRelease

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/sideload/release/app-sideload-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "PhantomLock-${{ steps.version.outputs.app_version }}.apk"
          ls -lh "PhantomLock-${{ steps.version.outputs.app_version }}.apk"

      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-lock-release-apk
          path: PhantomLock-${{ steps.version.outputs.app_version }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Phantom Lock GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Refusing to overwrite a published version."
            exit 1
          fi
          gh release create "$tag" "PhantomLock-${APP_VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Phantom Lock ${APP_VERSION}" \
            --generate-notes
