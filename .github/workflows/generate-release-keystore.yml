name: Generate Phantom Lock Release Keystore

on:
  workflow_dispatch:
    inputs:
      generate_keystore:
        description: "Confirm you want to generate Phantom Lock's permanent signing identity"
        required: true
        default: false
        type: boolean

permissions:
  actions: read

jobs:
  generate-keystore:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_keystore == true
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate permanent Phantom Lock signing credentials
        run: |
          set -euo pipefail
          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$KEYSTORE_PASSWORD"

          keytool -genkeypair \
            -v \
            -keystore phantom-lock-release.keystore \
            -alias phantomlock \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype PKCS12 \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Phantom Lock, OU=Mobile, O=Phantom Lock, L=Unknown, ST=Unknown, C=NG"

          {
            echo "ANDROID_KEY_ALIAS=phantomlock"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } > phantom-lock-signing-credentials.txt

      - name: Store permanent signing files
        uses: actions/upload-artifact@v4
        with:
          name: phantom-lock-release-signing-files
          path: |
            phantom-lock-release.keystore
            phantom-lock-signing-credentials.txt
          if-no-files-found: error
          retention-days: 90
