name: Generate Phantom Lock Release Keystore

on:
  workflow_dispatch:
    inputs:
      generate_keystore:
        description: "Confirm you want to generate Phantom Lock's permanent signing identity"
        required: true
        default: false
        type: boolean

jobs:
  generate-keystore:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_keystore == true
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate encrypted permanent signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PHANTOM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Create the PHANTOM_KEYSTORE_PASSWORD Actions secret first."
            exit 1
          fi
          keytool -genkeypair -v -keystore phantom-lock-release.keystore -alias phantomlock -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 -keypass "$KEYSTORE_PASSWORD" -dname "CN=Phantom Lock, OU=Mobile, O=Phantom Lock, L=Unknown, ST=Unknown, C=NG"

      - name: Store encrypted keystore
        uses: actions/upload-artifact@v4
        with:
          name: phantom-lock-release-signing-files
          path: phantom-lock-release.keystore
          if-no-files-found: error
          retention-days: 90
