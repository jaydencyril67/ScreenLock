name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: phantom-lock-debug-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Accept licenses and install Android 35
        run: |
          yes | sdkmanager --licenses
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleSideloadDebug :app:assemblePlayDebug

      - name: Prepare direct APK download
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/sideload/debug/app-sideload-debug.apk"
          PLAY_APK="app/build/outputs/apk/play/debug/app-play-debug.apk"
          test -s "$APK"
          test -s "$PLAY_APK"
          cp "$APK" PhantomLock-debug.apk
          ls -lh PhantomLock-debug.apk "$PLAY_APK"

      - name: Save debug APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhantomLock-debug-APKs
          path: |
            PhantomLock-debug.apk
            app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish direct debug APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest PhantomLock-debug.apk --clobber
            gh release edit debug-latest --title "Phantom Lock Debug (latest)" --notes "Automatically updated debug sideload APK from the latest successful main-branch build. This is a debug build, not the production release."
          else
            gh release create debug-latest PhantomLock-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Phantom Lock Debug (latest)" \
              --notes "Automatically updated debug sideload APK from the latest successful main-branch build. This is a debug build, not the production release." \
              --prerelease
          fi
